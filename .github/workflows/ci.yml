name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  agent:
    name: Static SSH Agent
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build static Linux Agents
        shell: bash
        run: |
          set -euxo pipefail
          # 两个 cross 镜像的宿主 GLIBC 版本可能不同，必须隔离宿主 build script，禁止共用 target 根目录。
          CARGO_TARGET_DIR=src-tauri/target/cross-x86_64 \
            cross build --manifest-path src-tauri/Cargo.toml -p cc-switch-agent --release --target x86_64-unknown-linux-musl
          CARGO_TARGET_DIR=src-tauri/target/cross-aarch64 \
            cross build --manifest-path src-tauri/Cargo.toml -p cc-switch-agent --release --target aarch64-unknown-linux-musl

      - name: Verify and collect Agent artifacts
        shell: bash
        run: |
          set -euxo pipefail
          X86=src-tauri/target/cross-x86_64/x86_64-unknown-linux-musl/release/cc-switch-agent
          ARM=src-tauri/target/cross-aarch64/aarch64-unknown-linux-musl/release/cc-switch-agent
          test -s "$X86"
          test -s "$ARM"
          # musl 可生成 static PIE；打印原始元数据，并同时接受 file 的两种合法静态链接描述。
          STATIC_LINK_PATTERN='statically linked|static-pie linked'
          X86_FILE=$(file "$X86")
          ARM_FILE=$(file "$ARM")
          printf '%s\n%s\n' "$X86_FILE" "$ARM_FILE"
          grep -Eq "$STATIC_LINK_PATTERN" <<<"$X86_FILE"
          grep -Eq "$STATIC_LINK_PATTERN" <<<"$ARM_FILE"
          # ldd 对 static PIE 可能返回 0；直接检查 ELF 结构，并覆盖无法在本机执行的 aarch64 产物。
          verify_static_elf() {
            local binary=$1
            local program_headers
            local dynamic_section
            program_headers=$(readelf -l "$binary")
            dynamic_section=$(readelf -d "$binary")
            if grep -F 'INTERP' <<<"$program_headers" >/dev/null; then
              echo "$binary unexpectedly has a program interpreter" >&2
              exit 1
            fi
            if grep -F '(NEEDED)' <<<"$dynamic_section" >/dev/null; then
              echo "$binary unexpectedly depends on shared libraries" >&2
              exit 1
            fi
          }
          verify_static_elf "$X86"
          verify_static_elf "$ARM"
          mkdir -p agent-artifacts/linux-x86_64 agent-artifacts/linux-aarch64
          cp "$X86" agent-artifacts/linux-x86_64/cc-switch-agent
          cp "$ARM" agent-artifacts/linux-aarch64/cc-switch-agent

      - name: Upload static Agents
        uses: actions/upload-artifact@v6
        with:
          name: cc-switch-linux-agents
          path: agent-artifacts
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: [agent, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download static Agents
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: cc-switch-linux-agents
          path: agent-artifacts

      - name: Expose embedded Agent build inputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC_SWITCH_AGENT_X86_64_PATH=$GITHUB_WORKSPACE/agent-artifacts/linux-x86_64/cc-switch-agent" >> "$GITHUB_ENV"
          echo "CC_SWITCH_AGENT_AARCH64_PATH=$GITHUB_WORKSPACE/agent-artifacts/linux-aarch64/cc-switch-agent" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Start clean SSH server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/cc-switch-clean-key"
          PUBLIC_KEY=$(cat "$RUNNER_TEMP/cc-switch-clean-key.pub")
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          docker run -d --name cc-switch-clean-sshd \
            -p 127.0.0.1:22222:2222 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -e USER_NAME=ccswitch -e PUBLIC_KEY="$PUBLIC_KEY" \
            lscr.io/linuxserver/openssh-server:latest
          for attempt in $(seq 1 60); do
            if ssh-keyscan -p 22222 127.0.0.1 >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs cc-switch-clean-sshd
              exit 1
            fi
            sleep 1
          done
          echo "CC_SWITCH_CLEAN_SSH_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "CC_SWITCH_CLEAN_SSH_USER=ccswitch" >> "$GITHUB_ENV"
          echo "CC_SWITCH_CLEAN_SSH_PORT=22222" >> "$GITHUB_ENV"
          echo "CC_SWITCH_CLEAN_SSH_KEY=$RUNNER_TEMP/cc-switch-clean-key" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets -j 1

      - name: Stop clean SSH server
        if: always() && runner.os == 'Linux'
        run: docker rm -f cc-switch-clean-sshd

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Record the built test binary path so the run step below can execute
        # it directly instead of re-invoking cargo with TEMP on \\wsl.localhost.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinary = cargo test --lib --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test -and $artifact.target.name -eq 'cc_switch_lib') {
                  $artifact.executable
                }
              }
            } | Select-Object -First 1 -Wait
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testBinary) {
            throw "cc_switch_lib test binary not found in cargo compiler artifacts"
          }
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the test binary built in the previous step directly. Invoking cargo
        # here with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          # 切换 TEMP/TMP 到 WSL UNC 后直接运行已编译二进制，不再经过 cargo/link.exe。
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
