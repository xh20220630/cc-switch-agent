name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发即干跑：完整编译、签名、公证，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 带上事件名：手动干跑也能选 tag，和正式发布同组会把正在跑的发布取消掉
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。漏写的话
  # 升级到这一版的用户什么也看不到；结构写坏的话弹窗渲染出错，整个应用落进错误页。
  # 放在最前面查，不白跑编译。推 tag 和 push main 同时发生，不能指望 CI 先跑完单测，
  # 所以这里自己跑一遍检查所有随包摘要的那份单测。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 手动干跑可以在任意分支上跑，那时这一版的摘要可能还没写，只在推 tag 时要求存在
      - name: Require this version's summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::Missing $file. Write the in-app summary for $TAG (see src/whats-new/README.md); use \"items\": [] to skip the popup."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  agent-artifacts:
    name: Build static SSH Agents
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build static Linux Agents
        shell: bash
        run: |
          set -euxo pipefail
          # 两个 cross 镜像的宿主 GLIBC 版本可能不同，必须隔离宿主 build script，禁止共用 target 根目录。
          CARGO_TARGET_DIR=src-tauri/target/cross-x86_64 \
            cross build --manifest-path src-tauri/Cargo.toml -p cc-switch-agent --release --target x86_64-unknown-linux-musl
          CARGO_TARGET_DIR=src-tauri/target/cross-aarch64 \
            cross build --manifest-path src-tauri/Cargo.toml -p cc-switch-agent --release --target aarch64-unknown-linux-musl

      - name: Verify and collect Agent artifacts
        shell: bash
        run: |
          set -euxo pipefail
          X86=src-tauri/target/cross-x86_64/x86_64-unknown-linux-musl/release/cc-switch-agent
          ARM=src-tauri/target/cross-aarch64/aarch64-unknown-linux-musl/release/cc-switch-agent
          test -s "$X86"
          test -s "$ARM"
          # musl 可生成 static PIE；打印原始元数据，并同时接受 file 的两种合法静态链接描述。
          STATIC_LINK_PATTERN='statically linked|static-pie linked'
          X86_FILE=$(file "$X86")
          ARM_FILE=$(file "$ARM")
          printf '%s\n%s\n' "$X86_FILE" "$ARM_FILE"
          grep -Eq "$STATIC_LINK_PATTERN" <<<"$X86_FILE"
          grep -Eq "$STATIC_LINK_PATTERN" <<<"$ARM_FILE"
          # ldd 对 static PIE 可能返回 0；直接检查 ELF 结构，并覆盖无法在本机执行的 aarch64 产物。
          verify_static_elf() {
            local binary=$1
            local program_headers
            local dynamic_section
            program_headers=$(readelf -l "$binary")
            dynamic_section=$(readelf -d "$binary")
            if grep -F 'INTERP' <<<"$program_headers" >/dev/null; then
              echo "$binary unexpectedly has a program interpreter" >&2
              exit 1
            fi
            if grep -F '(NEEDED)' <<<"$dynamic_section" >/dev/null; then
              echo "$binary unexpectedly depends on shared libraries" >&2
              exit 1
            fi
          }
          verify_static_elf "$X86"
          verify_static_elf "$ARM"
          mkdir -p agent-artifacts/linux-x86_64 agent-artifacts/linux-aarch64
          cp "$X86" agent-artifacts/linux-x86_64/cc-switch-agent
          cp "$ARM" agent-artifacts/linux-aarch64/cc-switch-agent

      - name: Upload static Agents
        uses: actions/upload-artifact@v6
        with:
          name: cc-switch-linux-agents
          path: agent-artifacts
          if-no-files-found: error

  release:
    needs: [whats-new-check, agent-artifacts]
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      CC_SWITCH_AGENT_X86_64_PATH: ${{ github.workspace }}/agent-artifacts/linux-x86_64/cc-switch-agent
      CC_SWITCH_AGENT_AARCH64_PATH: ${{ github.workspace }}/agent-artifacts/linux-aarch64/cc-switch-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download static Agents
        uses: actions/download-artifact@v7
        with:
          name: cc-switch-linux-agents
          path: agent-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 只发布 MSI（和便携版 exe），不打用不上的 NSIS 安装包
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build --bundles msi
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # e.g., v3.5.0；手动干跑时是分支名，斜杠会被当成目录，换成 -
          $VERSION = $env:GITHUB_REF_NAME -replace '/', '-'
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "CC-Switch-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } else {
              throw "Signature not found for $($msi.Name)"
            }
          } else {
            throw "No Windows MSI installer found ($env:WINDOWS_RELEASE_ARCH)"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/cc-switch.exe')
          } else {
            @(
              'src-tauri/target/release/cc-switch.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# CC Switch portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# CC Switch portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/CC-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: CC-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
          } elseif ($isArm64) {
            throw 'Portable ARM64 exe not found'
          } else {
            Write-Warning 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # e.g., v3.5.0；手动干跑时是分支名，斜杠会被当成目录，换成 -
          VERSION="${GITHUB_REF_NAME//\//-}"
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          if [ ! -f "$APPIMAGE.sig" ]; then
            echo "❌ Updater signature not found: $APPIMAGE.sig" >&2
            exit 1
          fi
          NEW_APPIMAGE="CC-Switch-${VERSION}-Linux-${ARCH}.AppImage"
          cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
          cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
          echo "AppImage copied: $NEW_APPIMAGE"
          # 额外上传 .deb（用于 Debian/Ubuntu 自动更新）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -z "$DEB" ]; then
            echo "❌ No .deb found under target/release/bundle" >&2
            exit 1
          fi
          if [ ! -f "$DEB.sig" ]; then
            echo "❌ Updater signature not found: $DEB.sig" >&2
            exit 1
          fi
          NEW_DEB="CC-Switch-${VERSION}-Linux-${ARCH}.deb"
          cp "$DEB" "release-assets/$NEW_DEB"
          cp "$DEB.sig" "release-assets/$NEW_DEB.sig"
          echo "Deb package copied: $NEW_DEB"
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等自动更新）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -z "$RPM" ]; then
            echo "❌ No .rpm found under target/release/bundle" >&2
            exit 1
          fi
          if [ ! -f "$RPM.sig" ]; then
            echo "❌ Updater signature not found: $RPM.sig" >&2
            exit 1
          fi
          NEW_RPM="CC-Switch-${VERSION}-Linux-${ARCH}.rpm"
          cp "$RPM" "release-assets/$NEW_RPM"
          cp "$RPM.sig" "release-assets/$NEW_RPM.sig"
          echo "RPM package copied: $NEW_RPM"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    # 只有推 tag 才发布。手动触发时也能选 tag 作为运行版本，单看 ref_type 会把干跑当成正式发布，
    # 覆盖已发布 release 的正文和安装包
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      # 发布说明随 tag 保存，必须先检出当前版本，避免用固定模板覆盖真实更新内容。
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          # 只有带预发布后缀的 tag(如 v0.1.0-beta)才是 prerelease；正式 tag 必须为正式
          # release，否则 GitHub 不产生 latest 指针，updater 端点 …/latest/download/
          # latest.json 返回 404，客户端检查更新永远失败。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/release-notes/${{ github.ref_name }}-zh.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Prepare GH
        run: |
          gh --version || (type -p curl >/dev/null && sudo apt-get update && sudo apt-get install -y gh || true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true
      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"
          # 初始化空平台映射
          win_x64_url=""; win_x64_sig=""
          win_arm64_url=""; win_arm64_sig=""
          linux_x64_url=""; linux_x64_sig=""
          linux_arm64_url=""; linux_arm64_sig=""
          linux_x64_deb_url=""; linux_x64_deb_sig=""
          linux_arm64_deb_url=""; linux_arm64_deb_sig=""
          linux_x64_rpm_url=""; linux_x64_rpm_sig=""
          linux_arm64_rpm_url=""; linux_arm64_rpm_sig=""
          shopt -s nullglob
          # 下载目录为 dl；必须从同一目录收集签名，避免平台清单为空。
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *-Windows-arm64.msi)
                win_arm64_url="$url"; win_arm64_sig="$sig_content";;
              *-Windows.msi)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *-Linux-arm64.AppImage|*-Linux-arm64.appimage)
                linux_arm64_url="$url"; linux_arm64_sig="$sig_content";;
              *-Linux-x86_64.AppImage|*-Linux-x86_64.appimage)
                linux_x64_url="$url"; linux_x64_sig="$sig_content";;
              *-Linux-arm64.deb)
                linux_arm64_deb_url="$url"; linux_arm64_deb_sig="$sig_content";;
              *-Linux-x86_64.deb)
                linux_x64_deb_url="$url"; linux_x64_deb_sig="$sig_content";;
              *-Linux-arm64.rpm)
                linux_arm64_rpm_url="$url"; linux_arm64_rpm_sig="$sig_content";;
              *-Linux-x86_64.rpm)
                linux_x64_rpm_url="$url"; linux_x64_rpm_sig="$sig_content";;
            esac
          done
          # 缺任一平台都不能发：缺的那批用户会静默收不到更新
          missing=""
          [ -n "$win_x64_sig" ] || missing="$missing windows-x86_64"
          [ -n "$win_arm64_sig" ] || missing="$missing windows-aarch64"
          [ -n "$linux_x64_sig" ] || missing="$missing linux-x86_64"
          [ -n "$linux_arm64_sig" ] || missing="$missing linux-aarch64"
          [ -n "$linux_x64_deb_sig" ] || missing="$missing linux-x86_64-deb"
          [ -n "$linux_arm64_deb_sig" ] || missing="$missing linux-aarch64-deb"
          [ -n "$linux_x64_rpm_sig" ] || missing="$missing linux-x86_64-rpm"
          [ -n "$linux_arm64_rpm_sig" ] || missing="$missing linux-aarch64-rpm"
          if [ -n "$missing" ]; then
            echo "❌ Missing updater signatures for:$missing" >&2
            exit 1
          fi
          # 构造 JSON
          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\",";
            echo "  \"notes\": \"Release $TAG\",";
            echo "  \"pub_date\": \"$PUB_DATE\",";
            echo '  "platforms": {'
            first=1
            if [ -n "$win_x64_url" ] && [ -n "$win_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
              first=0
            fi
            if [ -n "$win_arm64_url" ] && [ -n "$win_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-aarch64\": {\"signature\": \"$win_arm64_sig\", \"url\": \"$win_arm64_url\"}"
              first=0
            fi
            if [ -n "$linux_x64_url" ] && [ -n "$linux_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64\": {\"signature\": \"$linux_x64_sig\", \"url\": \"$linux_x64_url\"}"
              first=0
            fi
            if [ -n "$linux_arm64_url" ] && [ -n "$linux_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-aarch64\": {\"signature\": \"$linux_arm64_sig\", \"url\": \"$linux_arm64_url\"}"
              first=0
            fi
            if [ -n "$linux_x64_deb_url" ] && [ -n "$linux_x64_deb_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64-deb\": {\"signature\": \"$linux_x64_deb_sig\", \"url\": \"$linux_x64_deb_url\"}"
              first=0
            fi
            if [ -n "$linux_arm64_deb_url" ] && [ -n "$linux_arm64_deb_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-aarch64-deb\": {\"signature\": \"$linux_arm64_deb_sig\", \"url\": \"$linux_arm64_deb_url\"}"
              first=0
            fi
            if [ -n "$linux_x64_rpm_url" ] && [ -n "$linux_x64_rpm_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64-rpm\": {\"signature\": \"$linux_x64_rpm_sig\", \"url\": \"$linux_x64_rpm_url\"}"
              first=0
            fi
            if [ -n "$linux_arm64_rpm_url" ] && [ -n "$linux_arm64_rpm_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-aarch64-rpm\": {\"signature\": \"$linux_arm64_rpm_sig\", \"url\": \"$linux_arm64_rpm_url\"}"
              first=0
            fi
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "Generated latest.json:" && cat "$tmp_json"
          mv "$tmp_json" latest.json
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          # fork 的稳定版本标签直接发布，只有带后缀的标签标记为预发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 这里只追加更新清单，保留 publish-release 写入的版本说明。
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
